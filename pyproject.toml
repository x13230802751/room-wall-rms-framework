[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "room-wall-rms-framework"
version = "1.0.0"
description = "Full-room Efficient RANSAC wall supports and modular geometric RMS measurement"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "matplotlib>=3.8,<4", "python-docx>=1.1,<2"]

[project.scripts]
room-measure = "room_measurement.__main__:main"

[tool.setuptools.packages.find]
include = ["room_measurement*", "room_walls*"]
